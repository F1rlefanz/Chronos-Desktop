# The plugin is a workspace member rather than only a dependency, so that
# `cargo clippy --workspace` lints its desktop half on a machine that never
# builds for Android. It is depended on for Android alone (see below).
[workspace]
members = [".", "plugins/chronos-saf"]

[package]
name = "chronos-desktop"
# Cargo requires a version, but this is NOT the app version: tauri.conf.json
# points at ../package.json, which is the single source for the installer, the
# executable's version resource and the badge in the header. Leave this alone
# when bumping a release.
version = "0.0.0"
description = "Precision stopwatch and time tracker"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The desktop entry point is a thin main.rs over this library, which is also
# what integration tests would link against.
name = "chronos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# The one dependency syncing added: picking the shared folder needs the system's
# own folder chooser, and a path typed into a text field is a path with a typo
# in it that only shows up at the first sync.
tauri-plugin-dialog = "2"

# Android reaches the shared folder through the Storage Access Framework, which
# is Kotlin and has no desktop counterpart — so the plugin is a dependency only
# where it means something. A desktop build does not compile a line of it.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-chronos-saf = { path = "plugins/chronos-saf" }

[profile.release]
# A time tracker does not need to ship debug symbols; this keeps the installer
# in the tens of megabytes rather than the hundreds.
strip = true
lto = true
codegen-units = 1
panic = "abort"
