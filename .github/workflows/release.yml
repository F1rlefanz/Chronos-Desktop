name: Release

# A tag is the whole trigger: push v1.2.3 and this produces the release, its
# notes and an installer for every desktop system.
#
# It can also be run by hand without a tag, which builds every platform and
# attaches the results to the run instead of publishing them — the way to find
# out that something no longer compiles on Linux without cutting a release to
# discover it.
#
# Deliberately not on every push: this repository is private, so Actions minutes
# are billed, and macOS bills at ten times the rate of Linux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.6.0. Leave empty for a build-only dry run.'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The release exists before any build starts, so the platform jobs upload into
  # it rather than racing each other to create it.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      publishing: ${{ steps.resolve.outputs.publishing }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The tag is resolved in the shell rather than in an expression: an
      # empty-string fallback inside ${{ }} has to be quoted through YAML as
      # well, and getting that wrong produces a script that does not parse.
      - name: Work out what this run is
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag=""
          fi

          if [ -n "$tag" ]; then
            {
              echo "publishing=true"
              echo "tag=$tag"
              echo "ref=$tag"
            } >> "$GITHUB_OUTPUT"
            echo "Publishing $tag."
          else
            {
              echo "publishing=false"
              echo "tag="
              echo "ref=$REF_NAME"
            } >> "$GITHUB_OUTPUT"
            echo "Dry run on $REF_NAME - building, not publishing."
          fi

      - name: Take the notes from the changelog
        if: steps.resolve.outputs.publishing == 'true'
        run: python3 .github/scripts/changelog_section.py "${{ steps.resolve.outputs.tag }}" notes.md

      - name: Create the release, unless it is already there
        if: steps.resolve.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.resolve.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving its notes alone."
          else
            gh release create "$tag" --title "Chronos Desktop ${tag#v}" --notes-file notes.md
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            name: Windows
            args: ''
            rust-targets: ''
          # One macOS runner producing a binary for both chips, rather than two
          # runners producing one each: macOS minutes bill at ten times Linux.
          - os: macos-latest
            name: macOS (universal)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri draws its window with the system webview; on Linux that is
      # WebKitGTK, which is not on the runner by default.
      - name: Install the Linux webview and its build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run here rather than in a workflow of their own: a warning that only
      # appears on Linux or macOS is exactly the kind this repository cannot
      # otherwise see, and the compilation is needed for the build anyway.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build the app
        run: bun run tauri build ${{ matrix.args }}

      - name: Collect what was built
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No bundle was produced on ${{ matrix.name }}."
            exit 1
          fi
          printf 'Built:\n'; printf '  %s\n' "${files[@]}"
          mkdir -p artifacts
          cp "${files[@]}" artifacts/

      - name: Attach them to the run
        uses: actions/upload-artifact@v4
        with:
          name: chronos-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish them to the release
        if: needs.prepare.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload '${{ needs.prepare.outputs.tag }}' artifacts/* --clobber
