name: Release

# A tag is the whole trigger: push v1.2.3 and this produces the release, its
# notes and an installer for every desktop system.
#
# It can also be run by hand without a tag, which builds every platform and
# attaches the results to the run instead of publishing them — the way to find
# out that something no longer compiles on Linux without cutting a release to
# discover it.
#
# Deliberately not on every push: a full matrix build costs tens of minutes of
# runner time, and on a private repository that time is billed — macOS at ten
# times the rate of Linux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.6.0. Leave empty for a build-only dry run.'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The release exists before any build starts, so the platform jobs upload into
  # it rather than racing each other to create it.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      publishing: ${{ steps.resolve.outputs.publishing }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The tag is resolved in the shell rather than in an expression: an
      # empty-string fallback inside ${{ }} has to be quoted through YAML as
      # well, and getting that wrong produces a script that does not parse.
      - name: Work out what this run is
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag=""
          fi

          if [ -n "$tag" ]; then
            {
              echo "publishing=true"
              echo "tag=$tag"
              echo "ref=$tag"
            } >> "$GITHUB_OUTPUT"
            echo "Publishing $tag."
          else
            {
              echo "publishing=false"
              echo "tag="
              echo "ref=$REF_NAME"
            } >> "$GITHUB_OUTPUT"
            echo "Dry run on $REF_NAME - building, not publishing."
          fi

      - name: Take the notes from the changelog
        if: steps.resolve.outputs.publishing == 'true'
        run: python3 .github/scripts/changelog_section.py "${{ steps.resolve.outputs.tag }}" notes.md

      - name: Create the release, unless it is already there
        if: steps.resolve.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.resolve.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving its notes alone."
          else
            gh release create "$tag" --title "Chronos Desktop ${tag#v}" --notes-file notes.md
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            name: Windows
            args: ''
            rust-targets: ''
          # One macOS runner producing a binary for both chips, rather than two
          # runners producing one each: macOS minutes bill at ten times Linux.
          - os: macos-latest
            name: macOS (universal)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri draws its window with the system webview; on Linux that is
      # WebKitGTK, which is not on the runner by default.
      - name: Install the Linux webview and its build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run here rather than in a workflow of their own: a warning that only
      # appears on Linux or macOS is exactly the kind this repository cannot
      # otherwise see, and the compilation is needed for the build anyway.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The private half of the updater's keypair. Without it the build still
      # succeeds but produces unsigned bundles and no `.sig` files, and the
      # manifest step downstream then refuses to write a manifest rather than
      # publishing one nobody's updater will accept.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build ${{ matrix.args }}

      # The `.sig` files and the macOS `.app.tar.gz` are here for the updater,
      # not for a person: nobody downloads a signature. They are attached to the
      # release because the manifest has to point at a URL, and the release is
      # the only public one this project has.
      - name: Collect what was built
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No bundle was produced on ${{ matrix.name }}."
            exit 1
          fi
          printf 'Built:\n'; printf '  %s\n' "${files[@]}"
          mkdir -p artifacts
          cp "${files[@]}" artifacts/

      # v7 refuses a glob matching more than one file, but only with
      # `archive: false` — the unzipped direct upload it added. Left at the
      # default, this still zips a whole folder, which is what a matrix job
      # producing four bundles needs.
      - name: Attach them to the run
        uses: actions/upload-artifact@v7
        with:
          name: chronos-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish them to the release
        if: needs.prepare.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload '${{ needs.prepare.outputs.tag }}' artifacts/* --clobber

  # Android is built and, on a tag, signed and published — because a phone that
  # cannot be handed an APK cannot be updated at all, and Chronos is not in a
  # store. The signing key is the *same* one that signed every earlier build:
  # Android refuses an update signed by a different key, and switching would mean
  # uninstalling first, which takes the recorded time with it.
  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Gradle cannot read the class files newer JDKs produce; 21 is what the
      # generated project expects.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Restored from secrets into the place Gradle already looks. The file is
      # gitignored and the properties it needs are the four the local one holds,
      # so the build script is untouched — CI simply arrives with the same
      # keystore a local build would find.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No signing key. A release APK cannot be built without it."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > src-tauri/gen/android/chronos-dev.keystore
          {
            echo "storeFile=chronos-dev.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      # Universal rather than one architecture: the release APK is what a phone
      # downloads and installs itself, and there is nothing at the other end to
      # pick the right one.
      - name: Build the APK
        run: bun run tauri android build --apk

      - name: Name it after the version
        id: apk
        run: |
          built=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)
          if [ -z "$built" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp "$built" "artifacts/Chronos-$version.apk"
          echo "path=artifacts/Chronos-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Attach it to the run
        uses: actions/upload-artifact@v7
        with:
          name: chronos-android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish it to the release
        if: needs.prepare.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.prepare.outputs.tag }}' '${{ steps.apk.outputs.path }}' --clobber

  # Last, because a manifest can only name bundles that are already uploaded.
  # This is the step that actually turns a release into an update: until
  # latest.json exists, every installed copy keeps reporting itself current.
  manifests:
    name: Update manifests
    needs: [prepare, build, android]
    if: needs.prepare.outputs.publishing == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Take the notes from the changelog
        run: python3 .github/scripts/changelog_section.py "${{ needs.prepare.outputs.tag }}" notes.md

      - name: Build them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            python3 .github/scripts/update_manifests.py "${{ needs.prepare.outputs.tag }}" notes.md

      # Whichever of the two exists: a desktop-only release writes no Android
      # manifest, and naming a file that is not there would fail the run over
      # something the script already warned about.
      - name: Publish them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          written=(latest.json latest-android.json)
          gh release upload '${{ needs.prepare.outputs.tag }}' "${written[@]}" --clobber
