name: Desktop build

# Deliberately not on every pull request: a cold Rust build takes minutes, and
# the web job in ci.yml is the one that has to stay fast enough to block a
# merge. This runs on demand and for release tags.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build the installer
        run: bun run desktop:build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: chronos-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
